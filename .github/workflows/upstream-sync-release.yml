name: Sync upstream and build RapidOne releases

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build again even if upstream has not changed'
        required: false
        type: boolean
        default: false
  # Bootstrap one build after installing this workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-sync-release.yml'

permissions:
  contents: write

concurrency:
  group: rapidone-upstream-sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.sync.outputs.build }}
      tag: ${{ steps.sync.outputs.tag }}
      sha: ${{ steps.sync.outputs.sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      upstream_release: ${{ steps.sync.outputs.upstream_release }}
      mirror_tag: ${{ steps.sync.outputs.mirror_tag }}
      mirror_needed: ${{ steps.sync.outputs.mirror_needed }}
      portable_needed: ${{ steps.sync.outputs.portable_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: sync
        name: Merge upstream changes without overwriting the fork's CI
        shell: bash
        env:
          FORCE: ${{ inputs.force_release || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/crispin81/RapidOne.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          changed=false

          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            # Never force-push: preserve local CI/history, stop safely on conflict.
            git merge --no-ff --no-edit "$upstream_sha"
            git push origin HEAD:main
            changed=true
          fi

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          # Track upstream releases independently from source commits:
          # a release may be published after its source commit.
          upstream_release="$(gh api repos/crispin81/RapidOne/releases/latest --jq '.tag_name')"
          mirror_tag="upstream-${upstream_release}"
          mirror_needed=true
          if gh release view "$mirror_tag" >/dev/null 2>&1; then
            mirror_needed=false
          fi
          portable_needed=true
          portable_name="RapidOne_${upstream_release#v}_windows_x64_portable.zip"
          if gh release view "$mirror_tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$portable_name"; then
            portable_needed=false
          fi
          {
            echo "upstream_release=$upstream_release"
            echo "mirror_tag=$mirror_tag"
            echo "mirror_needed=$mirror_needed"
            echo "portable_needed=$portable_needed"
          } >> "$GITHUB_OUTPUT"
          if [[ "$changed" != true && "$FORCE" != true && "$GITHUB_EVENT_NAME" != push ]]; then
            echo 'No upstream change. Skip build.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$(git rev-parse HEAD)"
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}-sync.${sha:0:12}"
          if [[ "$FORCE" == true && "$changed" != true ]]; then
            tag="v${version}-manual.${sha:0:12}.${GITHUB_RUN_ID}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "RapidOne upstream $upstream_sha" "$sha"
            git push origin "refs/tags/$tag"
          fi
          {
            echo 'build=true'
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Source: $sha / upstream: $upstream_sha / tag: $tag"

  dependency-check:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Authenticate to upstream modules if separately authorized
        shell: bash
        env:
          MODULES_TOKEN: ${{ secrets.RAPIDONE_MODULES_TOKEN }}
        run: |
          if [[ -n "$MODULES_TOKEN" ]]; then
            git config --global url."https://x-access-token:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - id: check
        name: Check optional private-source compilation prerequisites
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          missing=false
          for repo in crispin81/RapidCulling-module crispin81/RapidRetouch-module; do
            if git ls-remote --exit-code "https://github.com/$repo.git" refs/heads/module >/dev/null 2>&1; then
              echo "$repo accessible"
            else
              echo "::warning::$repo cannot be fetched (private, unavailable, or access not granted). This is an upstream dependency, not a compiler error. Official upstream release mirroring is the fallback until access is granted."
              missing=true
            fi
          done
          if [[ "$missing" == true ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Private module access unavailable: skipping source compilation.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Both upstream modules accessible: enabling source compilation.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: [sync, dependency-check]
    if: needs.sync.outputs.build == 'true' && needs.dependency-check.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            args: ''
            config: src-tauri/tauri.release.conf.json
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ''
            config: src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.windows.conf.json
          - os: macos-latest
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            config: src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.tag }}

      - name: Configure optional source module authentication
        shell: bash
        env:
          MODULES_TOKEN: ${{ secrets.RAPIDONE_MODULES_TOKEN }}
        run: |
          if [[ -n "$MODULES_TOKEN" ]]; then
            git config --global url."https://x-access-token:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install Linux build prerequisites (ONNX WebGPU requires Ubuntu 24.04+)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential rpm libfuse2t64 libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - uses: actions/cache@v4
        with:
          path: |
            models/
          key: rapidone-models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Install Node and TypeScript dependencies
        run: npm ci

      - name: Fetch distributable AI models
        run: npm run fetch-models

      - name: Prebuild to obtain Windows DirectML or Linux WebGPU libraries
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/../lib/RapidOne'
          fi
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p src-tauri/linux-lib
            test -s src-tauri/target/release/libwebgpu_dawn.so
            cp src-tauri/target/release/libwebgpu_dawn.so src-tauri/linux-lib/
          fi

      - name: Repair upstream Windows CRT directory glob for CI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The upstream prepare-release.sh has extra literal whitespace
          # in the Visual Studio CRT glob. Repair in the runner only.
          sed -i 's/\.CRT          "/.CRT" "/' scripts/prepare-release.sh

      - name: Stage uv and the pinned Retouch Python engine
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/prepare-release.sh ${{ matrix.triple }}

      - name: Install patched AppImage GTK hook from upstream
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.cache/tauri
          cp .github/appimage/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: Build and attach platform installers to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ needs.sync.outputs.tag }}
          releaseName: 'RapidOne ${{ needs.sync.outputs.tag }}'
          releaseBody: |
            Auto-built from crispin81/RapidOne main.
            Upstream source: ${{ needs.sync.outputs.upstream_sha }}
            Fork commit: ${{ needs.sync.outputs.sha }}
            Includes Edit models. Retouch's Python engine is set up at first launch.
            Unsigned desktop installers: see README for platform guidance.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config ${{ matrix.config }}

  publish:
    needs: [sync, build]
    if: needs.sync.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.sync.outputs.tag }}
    steps:
      - name: Add stable filenames, checksums, and publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" -D out
          cd out
          shopt -s nullglob

          win_exe=(*_x64-setup.exe)
          win_msi=(*_x64_en-US.msi)
          mac=(*_aarch64.dmg)
          linux_app=(*_amd64.AppImage)
          linux_deb=(*_amd64.deb)
          for name in win_exe win_msi mac linux_app linux_deb; do
            eval "count=\${#${name}[@]}"
            if (( count != 1 )); then
              echo "::error::Expected exactly one asset for $name, got $count"
              exit 1
            fi
          done

          cp "${win_exe[0]}" RapidOne_windows_x64_setup.exe
          cp "${win_msi[0]}" RapidOne_windows_x64.msi
          cp "${mac[0]}" RapidOne_mac_apple_silicon.dmg
          cp "${linux_app[0]}" RapidOne_linux_x86_64.AppImage
          cp "${linux_deb[0]}" RapidOne_linux_amd64.deb

          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          gh release upload "$TAG" --clobber \
            RapidOne_windows_x64_setup.exe \
            RapidOne_windows_x64.msi \
            RapidOne_mac_apple_silicon.dmg \
            RapidOne_linux_x86_64.AppImage \
            RapidOne_linux_amd64.deb SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest

          echo "### Published RapidOne $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  mirror-upstream-binaries:
    needs: [sync, dependency-check]
    if: needs.sync.outputs.mirror_needed == 'true' && needs.dependency-check.outputs.available != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM_RELEASE: ${{ needs.sync.outputs.upstream_release }}
      MIRROR_TAG: ${{ needs.sync.outputs.mirror_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror official upstream binaries with provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          # Another run may have mirrored the release before we started.
          if gh release view "$MIRROR_TAG" >/dev/null 2>&1; then
            echo "Already mirrored $MIRROR_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/crispin81/RapidOne.git
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_RELEASE"
          official_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "Official release tag $UPSTREAM_RELEASE at $official_commit"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$MIRROR_TAG" >/dev/null 2>&1; then
            git tag -a "$MIRROR_TAG" "$official_commit" -m "Mirror of upstream RapidOne $UPSTREAM_RELEASE, not compiled by this fork"
            git push origin "refs/tags/$MIRROR_TAG"
          fi

          mkdir -p out
          gh release download "$UPSTREAM_RELEASE" -R crispin81/RapidOne -D out
          cd out
          for f in RapidCull_android.apk RapidOne_linux_amd64.deb RapidOne_linux_x86_64.AppImage \
                   RapidOne_mac_apple_silicon.dmg RapidOne_windows_x64.msi \
                   RapidOne_windows_x64_setup.exe SHA256SUMS.txt; do
            test -s "$f" || { echo "::error::Upstream release lacks $f"; exit 1; }
          done
          sha256sum --check SHA256SUMS.txt
          cd ..
          cat > release-notes.md <<EOF
          ## Official upstream binary mirror — NOT locally compiled

          These are the **unaltered** files published by [crispin81/RapidOne](https://github.com/crispin81/RapidOne/releases/tag/$UPSTREAM_RELEASE).
          Their SHA256 checksums were verified against the upstream release's SHA256SUMS.txt before mirroring.

          - Upstream release: $UPSTREAM_RELEASE
          - Upstream release commit: $official_commit
          - Build provenance: **upstream's published binaries, copied unchanged**.
          - This fork cannot compile from source unless its CI has authorized access to
            crispin81/RapidCulling-module and crispin81/RapidRetouch-module.
          - Upstream and these mirrored unsigned installers are not re-signed by this fork.
          EOF

          gh release create "$MIRROR_TAG" out/* \
            --verify-tag \
            --title "RapidOne $UPSTREAM_RELEASE (official upstream binary mirror)" \
            --notes-file release-notes.md \
            --latest

          echo "### Published $MIRROR_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: https://github.com/crispin81/RapidOne/releases/tag/$UPSTREAM_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Mirror: https://github.com/$GH_REPO/releases/tag/$MIRROR_TAG" >> "$GITHUB_STEP_SUMMARY"


  windows-portable:
    needs: [sync, dependency-check, mirror-upstream-binaries, publish]
    # The fallback mirrors official installers. Source builds are packaged
    # only when all platform builds and their release publish succeeded.
    if: >-
      always() && needs.sync.result == 'success' &&
      ((needs.sync.outputs.portable_needed == 'true' &&
        (needs.mirror-upstream-binaries.result == 'success' ||
         (needs.mirror-upstream-binaries.result == 'skipped' &&
          needs.dependency-check.outputs.available != 'true'))) ||
       needs.publish.result == 'success')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TARGET_TAG: ${{ needs.publish.result == 'success' && needs.sync.outputs.tag || needs.sync.outputs.mirror_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: portable_check
        name: Check existing portable asset before downloading large MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:TARGET_TAG.StartsWith('upstream-v')) {
            $env:TARGET_TAG.Substring('upstream-v'.Length)
          } else {
            ($env:TARGET_TAG -replace '^v', '') -replace '-(sync|manual)\..*$', ''
          }
          $file = "RapidOne_${version}_windows_x64_portable.zip"
          $names = @(gh release view $env:TARGET_TAG -R $env:GH_REPO --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect release assets' }
          if ($names -contains $file) {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Already published $file; skipping redundant download and ZIP upload."
          } else {
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$file not yet published; starting MSI repackaging."
          }

      - name: Download Windows installer
        if: steps.portable_check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TARGET_TAG -R $env:GH_REPO | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release does not exist' }
          New-Item -ItemType Directory -Path download -Force | Out-Null
          gh release download $env:TARGET_TAG -R $env:GH_REPO -D download -p 'RapidOne_windows_x64.msi'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path download/RapidOne_windows_x64.msi)) {
            throw 'No Windows MSI found in release'
          }

      - name: Package Windows portable ZIP
        if: steps.portable_check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET_TAG.StartsWith('upstream-v')) {
            $version = $env:TARGET_TAG.Substring('upstream-v'.Length)
          } else {
            $version = ($env:TARGET_TAG -replace '^v', '') -replace '-(sync|manual)\..*$', ''
          }
          ./scripts/build-windows-portable.ps1 `
            -MsiPath download/RapidOne_windows_x64.msi `
            -Version $version `
            -OutputDir portable
          $zip = Get-Item "portable/RapidOne_${version}_windows_x64_portable.zip"
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($zip.Name)" | Set-Content -Path 'portable/RapidOne_windows_x64_portable.sha256.txt' -Encoding Ascii
          Write-Host "SHA256: $hash"

      - name: Publish derived portable ZIP and document provenance
        if: steps.portable_check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -Path portable -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256.txt' } |
            ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "Expected ZIP and checksum, found $($assets.Count)" }
          gh release upload $env:TARGET_TAG @assets -R $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }

          $body = gh release view $env:TARGET_TAG -R $env:GH_REPO --json body --jq '.body'
          $note = @'

          ### Windows portable ZIP (derived package)

          This additional ZIP is repackaged from the release MSI using Windows
          administrative extraction. Start with Start-RapidOne-Portable.cmd.
          In the official-upstream binary mirror, app-data redirection is only
          best-effort: the unmodified EXE lacks the fork's native portable
          paths and the private Cull/Retouch modules are not audited.
          Photo edits remain beside the original photos in sidecars folders.
          Use the separate RapidOne_windows_x64_portable.sha256.txt to verify
          this ZIP; upstream SHA256SUMS.txt only covers original upstream files.
          '@
          if ($body -notmatch '### Windows portable ZIP') {
            ($body + "`n" + $note) | Set-Content -Path portable-release-notes.md -Encoding UTF8
            gh release edit $env:TARGET_TAG -R $env:GH_REPO --notes-file portable-release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release note' }
          }
          Write-Host "Portable ZIP: https://github.com/$env:GH_REPO/releases/tag/$env:TARGET_TAG"

  repair-existing-mirror-notes:
    needs: sync
    if: github.event_name == 'push' && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.sync.outputs.mirror_tag }}
    steps:
      - name: Repair older release-note formatting if necessary
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq '.body' > release-body.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("release-body.md")
          original = p.read_text(encoding="utf-8")
          fixed = original.replace("   and .", "   crispin81/RapidCulling-module and crispin81/RapidRetouch-module.")
          p.write_text(fixed, encoding="utf-8")
          if original != fixed:
              Path("needs-repair").touch()
          PY
          if [[ -f needs-repair ]]; then
            gh release edit "$TAG" --notes-file release-body.md
            echo "Repaired module names in the previous release notes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-note repair necessary" >> "$GITHUB_STEP_SUMMARY"
          fi

